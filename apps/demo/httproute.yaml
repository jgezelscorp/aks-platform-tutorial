# HTTPRoute — attaches to the platform Gateway (gw-platform) and routes the app host
# to demo-svc. app teams own this; the platform team owns the Gateway (Section 5).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route
  namespace: demo
spec:
  parentRefs:
  - name: gw-platform
  hostnames:
  - "app.contoso.com"
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - { name: demo-svc, port: 80 }
