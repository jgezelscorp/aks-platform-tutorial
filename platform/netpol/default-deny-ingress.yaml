# Default-deny ALL ingress in namespace demo.
# Selects every pod; with no ingress rules, nothing may connect IN.
# policyTypes is Ingress only, so egress (incl. DNS) stays allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: demo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
